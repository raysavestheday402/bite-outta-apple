<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movie Library</title>
<!-- raysavestheday icon integration -->
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="icons/manifest.webmanifest">
<meta name="theme-color" content="#07152f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV Library">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: luminous icon-blue scene (fixed layer) > one hero header (the icon art blended into the scene, a bold "Movie Library" title, a Grid / Cover Flow toggle) that tucks away while scrolling down and returns on any scroll up > centered poster grid OR full-width Cover Flow stage > popcorn stripe + footer. No search, no filters. */
:root {
  color-scheme: dark;

  /* icon palette */
  --navy: #07152F;
  --navy-deep: #0A1B44;
  --royal: #053288;
  --sky-top: #1F5FD6;
  --sky-mid: #0D3A9E;
  --sky-bot: #071D5C;
  --gold: #FFC529;
  --gold-hi: #FFD25A;
  --orange: #FF9B24;
  --red: #C8102E;
  --heart-red: #E63946;
  --play-blue: #1E6BFF;
  --play-hi: #5E9BFF;
  --play-lo: #0A3FB8;
  --violet: #7B3FE4;
  --teal: #0A8591;
  --go-green: #1FAA4B;
  --go-green-hi: #45D873;
  --go-green-lo: #10783A;
  --amber: #F59E0B;

  /* neutrals and text */
  --white: #FFFFFF;
  --black: #000000;
  --muted: #5A6B8C;
  --meta: #C7DCFF;

  /* translucent layers */
  --glass-navy: rgba(7, 29, 92, .6);
  --hairline: rgba(255, 255, 255, .14);
  --hairline-2: rgba(255, 255, 255, .24);
  --veil: rgba(255, 255, 255, .12);
  --veil-14: rgba(255, 255, 255, .14);
  --ray: rgba(255, 255, 255, .07);
  --spot: rgba(189, 235, 251, .45);
  --spot-0: rgba(189, 235, 251, 0);
  --reflect: rgba(255, 255, 255, .28);
  --floor: rgba(189, 235, 251, .16);
  --cyan-line: rgba(189, 235, 251, .85);
  --cyan-soft: rgba(121, 178, 218, .65);

  /* gradients */
  --grad-gold: linear-gradient(180deg, var(--gold-hi), var(--orange));
  --grad-gold-d: linear-gradient(135deg, var(--gold-hi), var(--orange));
  --scene:
    radial-gradient(ellipse 50% 72px at 50% 0%, var(--spot) 0%, var(--spot-0) 100%),
    linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 38%, var(--sky-bot) 100%);
  --tile-1: linear-gradient(155deg, var(--play-blue), var(--navy));
  --tile-2: linear-gradient(155deg, var(--heart-red), var(--violet));
  --tile-3: linear-gradient(155deg, var(--violet), var(--play-blue));
  --tile-4: linear-gradient(155deg, var(--teal), var(--play-blue));

  /* shadows */
  --shadow-poster: 0 6px 14px rgba(0, 0, 0, .32);
  --shadow-lift: 0 16px 34px rgba(0, 0, 0, .45), 0 0 0 3px var(--cyan-line), 0 0 26px 4px var(--cyan-soft);
  --shadow-bar: 0 8px 20px rgba(2, 10, 40, .45);
  --shadow-btn: 0 8px 22px rgba(2, 10, 40, .45);
  --shadow-chip: 0 2px 6px rgba(2, 10, 40, .3);
  --shadow-text: 0 1px 3px rgba(2, 10, 40, .65);
  --shadow-tile: 0 2px 8px rgba(7, 21, 47, .35);
  --drop-ink: rgba(2, 10, 40, .55);

  /* type: Anton is the bold movie-poster title face; Impact is on every iPad and iPhone, so the title still looks right before the web font arrives */
  --font-display: "Anton", Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
  --font-body: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* header height: scales with the screen in either orientation */
  --hd: calc(env(safe-area-inset-top, 0px) + clamp(88px, min(14vw, 15vh), 132px));
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

/* kid-proof touch: no long-press preview or selection, no tap flash, no double-tap zoom (pinch zoom stays) */
* {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
html, body { touch-action: manipulation; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: var(--sky-bot);
  color: var(--white);
  font-family: var(--font-body), system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}

/* the scene: spotlight + blue gradient, light rays, a sprinkle of stars (fixed layer; iOS ignores background-attachment:fixed) */
#bg {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-color: var(--sky-bot);
  background-image: var(--scene);
}
#bg::before {
  content: ""; position: absolute; inset: 0;
  background: repeating-conic-gradient(from 0deg at 50% 0%, var(--ray) 0 4deg, transparent 4deg 12deg);
  -webkit-mask-image: linear-gradient(to bottom, var(--black) 0, var(--black) 64px, transparent 128px);
  mask-image: linear-gradient(to bottom, var(--black) 0, var(--black) 64px, transparent 128px);
}
#bg::after {
  content: ""; position: absolute; inset: 0;
  background:
    radial-gradient(circle at .6% 24%, var(--gold-hi) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 99.4% 16%, var(--white) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at .6% 62%, var(--white) 0 1px, transparent 2px),
    radial-gradient(circle at 99.4% 48%, var(--gold-hi) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at .6% 86%, var(--gold-hi) 0 1px, transparent 2px),
    radial-gradient(circle at 99.4% 78%, var(--white) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 30% 10%, var(--white) 0 1px, transparent 2px),
    radial-gradient(circle at 72% 8%, var(--gold-hi) 0 1px, transparent 2px),
    radial-gradient(circle at .6% 94%, var(--white) 0 1px, transparent 2px),
    radial-gradient(circle at 99.4% 92%, var(--gold-hi) 0 1.5px, transparent 2.5px);
}

/* paints the translucent iOS status-bar area with the same slice of the scene */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10;
  background-color: var(--sky-top);
  background-image: var(--scene);
  background-size: 100vw 100vh;
  background-position: 0 0;
  background-repeat: no-repeat;
}

.wrap {
  width: 100%;
  max-width: 1280px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.sr-only {
  position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
}

a:focus-visible, button:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

/* ---------- header: the icon art blended into the scene, with the title ---------- */
/* Its own background is the same slice of the scene as the page, so at the top of the page it melts into it and, floating over posters, it stays solid. */
.top {
  position: sticky; top: 0; z-index: 30;
  background-color: var(--sky-top);
  background-image: var(--scene);
  background-size: 100vw 100vh;
  background-position: 0 0;
  background-repeat: no-repeat;
  transition: transform .3s ease, box-shadow .2s ease;
}
.top.lift { box-shadow: var(--shadow-bar); }
/* scrolling down tucks it away; visibility keeps it from being tapped while it's off screen */
.top.away { transform: translateY(-110%); visibility: hidden; transition: transform .3s ease, visibility 0s .3s; }
.hero { position: relative; height: var(--hd); overflow: hidden; }
/* the art scales to any width (cover) and fades out at both sides and the bottom, so there are no hard edges in portrait or landscape */
.art {
  position: absolute; inset: 0;
  background: url(icons/header-art.jpg) 50% 16% / cover no-repeat;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%), linear-gradient(to bottom, #000 0, #000 46%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to right, transparent 0, #000 16%, #000 84%, transparent 100%), linear-gradient(to bottom, #000 0, #000 46%, transparent 100%);
  mask-composite: intersect;
}
.title {
  position: absolute; left: 0; right: 0; bottom: 8px; z-index: 1; margin: 0; padding: 0 16px 0 calc(16px + .04em);
  text-align: center;
  font-family: var(--font-display); font-weight: 400;
  font-size: clamp(32px, min(8vw, 6.6vh), 66px); white-space: nowrap; line-height: 1.04; letter-spacing: .04em; text-transform: uppercase;
  color: var(--gold-hi);
  background: linear-gradient(180deg, #FFF1A8 0%, var(--gold) 40%, var(--orange) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 2px 0 var(--navy-deep)) drop-shadow(0 4px 0 var(--navy-deep)) drop-shadow(0 8px 10px var(--drop-ink));
}

/* Grid / Cover Flow toggle: two picture buttons in the top corner */
.seg {
  position: absolute; z-index: 2; top: calc(env(safe-area-inset-top, 0px) + 6px); right: max(12px, env(safe-area-inset-right, 0px));
  display: inline-flex; align-items: stretch; gap: 2px; padding: 3px;
  border: 1px solid var(--hairline-2); border-radius: 999px; background: var(--glass-navy);
}
.seg-btn {
  display: grid; place-items: center; width: 64px; height: 56px; margin: 0; padding: 0; border: 0; border-radius: 999px;
  background: transparent; color: var(--white);
  cursor: pointer; -webkit-appearance: none; appearance: none;
}
.seg-btn svg { width: 32px; height: 32px; fill: currentColor; }
.seg-btn[aria-pressed="true"] { background: var(--grad-gold-d); color: var(--navy); box-shadow: var(--shadow-chip); }

@media (max-width: 599px) {
  :root { --hd: calc(env(safe-area-inset-top, 0px) + 116px); }
  .seg-btn { width: 54px; height: 48px; }
  .seg-btn svg { width: 28px; height: 28px; }
}

/* ---------- content ---------- */
main.wrap { padding-top: 14px; padding-bottom: 16px; min-height: 50vh; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 24px 18px; }
@media (min-width: 768px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
}
@media (max-width: 599px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 20px 12px; }
}

.card { position: relative; min-width: 0; }
/* two columns under the poster: the title (flexible) and a narrow column for the broken-link button */
.tap {
  display: grid; grid-template-columns: minmax(0, 1fr) 40px; column-gap: 8px;
  border-radius: 18px; color: inherit; text-decoration: none;
}
.name, .meta { grid-column: 1; }
/* no per-poster GPU layers or containers: hundreds of them is what made iOS Safari give up */
.poster {
  grid-column: 1 / -1; min-width: 0;
  position: relative; width: 100%; aspect-ratio: 2 / 3;
  border-radius: 16px; overflow: hidden; background: var(--royal);
  box-shadow: var(--shadow-poster);
  transition: transform .18s ease, box-shadow .18s ease;
}
.poster img { display: block; width: 100%; height: 100%; object-fit: cover; }
.poster .play-disc { --disc: 64px; opacity: 0; transform: scale(.8); transition: opacity .18s ease, transform .18s ease; }
@media (hover: hover) and (pointer: fine) {
  .tap:hover .poster { transform: translateY(-4px); box-shadow: var(--shadow-lift); }
  .tap:hover .poster .play-disc { opacity: 1; transform: scale(1); }
}
.tap:active .poster { transform: scale(.96); }

.name {
  margin-top: 10px; color: var(--white); text-shadow: var(--shadow-text);
  font-weight: 800; font-size: 15px; line-height: 1.25;
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: break-word; hyphens: manual;
}
.meta { margin-top: 2px; color: var(--meta); text-shadow: var(--shadow-text); font-weight: 700; font-size: 13px; line-height: 1.3; }

/* the round glowing play disc from the icon: blue disc, white triangle, thin white ring, cyan glow */
.play-disc {
  --disc: 64px;
  position: absolute; left: 50%; top: 50%;
  width: var(--disc); height: var(--disc); margin: calc(var(--disc) / -2) 0 0 calc(var(--disc) / -2);
  border-radius: 50%; border: 2px solid var(--white); pointer-events: none;
  background: radial-gradient(circle at 34% 26%, var(--play-hi) 0%, var(--play-blue) 52%, var(--play-lo) 100%);
  box-shadow: 0 0 0 4px var(--cyan-soft), 0 0 22px 6px var(--cyan-line), 0 0 46px 12px var(--play-blue);
}
.play-disc::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 34%; height: 38%;
  transform: translate(-36%, -50%); background: var(--white);
  clip-path: polygon(0 0, 100% 50%, 0 100%);
}

/* fallback tile when a title has no poster */
.ph {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 36px 12px;
  text-align: center; color: var(--white); text-shadow: var(--shadow-tile);
  font-family: var(--font-display);
  font-weight: 400; font-size: 22px; line-height: 1.1; letter-spacing: .02em; text-transform: uppercase;
}
.ph span { display: -webkit-box; -webkit-line-clamp: 6; line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ph.g1 { background: var(--tile-1); }
.ph.g2 { background: var(--tile-2); }
.ph.g3 { background: var(--tile-3); }
.ph.g4 { background: var(--tile-4); }

/* broken-link button: a small round glass button in the corner under each poster (grown-ups testing links) */
.brk {
  position: absolute; right: -6px; bottom: -5px; width: 44px; height: 44px; padding: 0;
  display: grid; place-items: center; isolation: isolate;
  border: 0; border-radius: 50%; background: none; color: var(--white);
  cursor: pointer; -webkit-appearance: none; appearance: none;
}
.brk::before {
  content: ""; position: absolute; z-index: -1; left: 5px; top: 5px; width: 34px; height: 34px;
  border: 1.5px solid var(--hairline-2); border-radius: 50%; background: var(--veil-14);
}
.brk svg { width: 20px; height: 20px; }
.brk[aria-pressed="true"] { color: var(--red); }
.brk[aria-pressed="true"]::before { background: var(--white); border-color: var(--white); }
.brk:focus-visible { outline: none; }
.brk:focus-visible::before { outline: 3px solid var(--gold); outline-offset: 3px; }

/* ---------- empty states ---------- */
.empty {
  max-width: 520px; margin: 40px auto 32px; padding: 28px 24px 32px; text-align: center;
  background: var(--glass-navy); border: 1px solid var(--hairline-2); border-radius: 24px;
  color: var(--white); font-weight: 800; font-size: 20px; line-height: 1.35;
}
.empty img { display: block; width: 96px; height: 96px; margin: 0 auto 16px; border-radius: 22px; box-shadow: 0 0 0 2px var(--cyan-line), 0 0 24px 4px var(--cyan-soft); }

/* ---------- Cover Flow ---------- */
/* sized so the covers, the title, the Play button and the scrubber all fit under the header without scrolling */
.flow { --cf-h: min(50vh, 500px); --cf-w: calc(var(--cf-h) * 2 / 3); padding-top: 6px; }
@supports (height: 100dvh) {
  .flow { --cf-h: max(170px, min(50vh, 500px, calc((100dvh - var(--hd) - 284px) / 1.14))); }
}
.stage {
  position: relative; height: calc(var(--cf-h) * 1.14 + 22px); overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, var(--black) calc(100% - 70px), transparent);
  mask-image: linear-gradient(to bottom, var(--black) calc(100% - 70px), transparent);
  perspective: 1100px; perspective-origin: 50% 38%;
  touch-action: none; cursor: grab;   /* swipes on the covers move the covers, never the page */
}
.stage:active { cursor: grabbing; }
.stage::before {
  content: ""; position: absolute; left: 0; right: 0; top: calc(var(--cf-h) + 15px); bottom: 0; z-index: 0;
  border-top: 1px solid var(--hairline);
  background: linear-gradient(180deg, var(--floor), transparent 75%);
}
.cf {
  position: absolute; left: 50%; top: 14px; display: block;
  width: var(--cf-w); height: var(--cf-h); margin-left: calc(var(--cf-w) / -2);
  border-radius: 10px; overflow: hidden; background: var(--royal);
  box-shadow: var(--shadow-poster);
  -webkit-box-reflect: below 2px linear-gradient(transparent 62%, var(--reflect));
  will-change: transform;
  color: inherit; text-decoration: none; -webkit-user-drag: none;
}
.cf img { display: block; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; }
.cf .shade { position: absolute; inset: 0; background: var(--black); opacity: 0; pointer-events: none; }
.cf .play-disc { --disc: max(72px, calc(var(--cf-w) * .36)); top: auto; bottom: 7%; margin: 0 0 0 calc(var(--disc) / -2); opacity: 0; }

.flow-info { padding-top: 4px; padding-bottom: 16px; text-align: center; }
.flow-title {
  min-height: 2.3em; margin: 0 auto; max-width: 760px;
  display: flex; align-items: flex-end; justify-content: center;
  font-family: var(--font-display); font-weight: 400; letter-spacing: .03em; text-transform: uppercase;
  font-size: 30px; line-height: 1.15; color: var(--white); text-shadow: var(--shadow-text);
}
.flow-title span {
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: break-word;
}
.flow-meta { margin: 4px 0 0; min-height: 1.4em; color: var(--meta); text-shadow: var(--shadow-text); font-weight: 700; font-size: 15px; }
.flow-actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; margin-top: 12px; }
.play-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 60px; padding: 0 34px; border-radius: 999px;
  background: var(--grad-gold-d); color: var(--navy); text-decoration: none;
  font-family: var(--font-body), system-ui, sans-serif; font-weight: 800; font-size: 21px; line-height: 1;
  box-shadow: var(--shadow-btn);
}
.play-btn svg { width: 24px; height: 24px; fill: currentColor; }
.flow-scrub { display: flex; align-items: center; gap: 14px; max-width: 560px; margin: 14px auto 0; }
.scrub {
  -webkit-appearance: none; appearance: none; flex: 1 1 auto; min-width: 0; height: 44px; margin: 0;
  background: transparent; cursor: pointer;
}
.scrub::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: var(--hairline-2); }
.scrub::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 38px; height: 38px; margin-top: -16px; border: 0; border-radius: 50%;
  background: var(--white); box-shadow: var(--shadow-btn);
}
.scrub::-moz-range-track { height: 6px; border-radius: 3px; background: var(--hairline-2); }
.scrub::-moz-range-thumb { width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--white); box-shadow: var(--shadow-btn); }
.flow-count { flex: none; min-width: 84px; text-align: right; color: var(--meta); text-shadow: var(--shadow-text); font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; }

@media (max-width: 599px) {
  .flow-title { font-size: 25px; }
  .play-btn { padding: 0 22px; font-size: 17px; }
}

/* ---------- no Wi-Fi alert (floats at the bottom of the screen while offline) ---------- */
.off-wrap {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; pointer-events: none;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.offline {
  pointer-events: auto; max-width: 720px; margin: 0 auto;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 18px;
  padding: 10px 14px; border-radius: 24px; border: 2px solid var(--white);
  background: linear-gradient(180deg, var(--heart-red), var(--red));
  box-shadow: var(--shadow-btn);
}
.off-msg {
  display: inline-flex; align-items: center; gap: 10px; margin: 0;
  font-family: var(--font-display); font-weight: 400; letter-spacing: .03em; text-transform: uppercase; font-size: 28px; line-height: 1.1;
  color: var(--white); text-shadow: var(--shadow-text);
}
.off-msg svg { flex: none; width: 42px; height: 42px; }
.dl-btn {
  display: inline-flex; align-items: center; gap: 10px;
  min-height: 58px; padding: 0 26px 0 14px; border-radius: 999px; border: 2px solid var(--white);
  background: linear-gradient(180deg, var(--go-green-hi), var(--go-green-lo)); color: var(--white);
  font-family: var(--font-body), system-ui, sans-serif; font-weight: 800; font-size: 20px; line-height: 1;
  text-decoration: none; text-shadow: var(--shadow-text); box-shadow: var(--shadow-btn);
  -webkit-user-drag: none; transition: transform .12s ease;
}
.dl-btn svg { flex: none; width: 32px; height: 32px; }
.dl-btn:active { transform: scale(.95); }
body.is-offline .foot { padding-bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
@media (max-width: 599px) {
  .off-msg { font-size: 24px; }
  .dl-btn { font-size: 18px; }
}

/* ---------- link check (grown-ups only: the small button in the footer, or ?test=1 on, ?test=0 off) ---------- */
.test-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding-top: 2px; padding-bottom: 12px;
  color: var(--white); font-weight: 800; font-size: 15px; line-height: 1.3; text-shadow: var(--shadow-text);
}
.test-sum { flex: 1 1 240px; margin: 0; }
.t-btn {
  min-height: 40px; margin: 0; padding: 0 16px; border-radius: 999px;
  border: 1px solid var(--hairline-2); background: var(--veil); color: var(--white);
  font-family: var(--font-body), system-ui, sans-serif; font-weight: 800; font-size: 15px;
  cursor: pointer; -webkit-appearance: none; appearance: none;
}
.t-btn[aria-pressed="true"] { background: var(--grad-gold-d); color: var(--navy); border-color: transparent; }
.link-flag {
  position: absolute; top: 8px; right: 8px; width: 36px; height: 36px;
  display: grid; place-items: center; border-radius: 50%; border: 2px solid currentColor;
  background: var(--white); box-shadow: var(--shadow-tile);
}
.link-flag svg { width: 20px; height: 20px; }
.link-flag.bad { color: var(--red); }
.link-flag.search { color: var(--amber); }
.marks { display: flex; gap: 6px; margin-top: 8px; }
.mark {
  flex: 1 1 0; min-height: 38px; margin: 0; padding: 0 8px; border-radius: 999px;
  border: 1px solid var(--hairline-2); background: var(--veil); color: var(--white);
  font-family: var(--font-body), system-ui, sans-serif; font-weight: 800; font-size: 14px; line-height: 1; white-space: nowrap;
  cursor: pointer; -webkit-appearance: none; appearance: none;
}
.mark.bad[aria-pressed="true"] { background: var(--red); border-color: var(--white); }
.flow-marks { flex: none; width: 220px; margin-top: 0; }
.flow-marks .mark { min-height: 56px; font-size: 16px; }

/* ---------- footer ---------- */
.stripe-wrap { margin-top: 28px; }
.stripe {
  height: 6px; border-radius: 3px;
  background: repeating-linear-gradient(135deg, var(--red) 0 10px, var(--white) 10px 20px);
}
.foot {
  margin-top: 0; padding: 22px 16px calc(28px + env(safe-area-inset-bottom, 0px));
  text-align: center; color: var(--meta); font-size: 13px; line-height: 1.5;
}
.foot-brand {
  display: inline-block; margin: 0 0 4px; padding: 0 .06em .1em 0;
  font-family: var(--font-display); font-weight: 400; letter-spacing: .04em; text-transform: uppercase;
  font-size: 22px; line-height: 1.2; color: var(--gold-hi);
  background: var(--grad-gold); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.foot p { max-width: 460px; margin: 0 auto; }
.foot-btn { margin-top: 14px; min-height: 36px; font-size: 13px; color: var(--meta); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .tap:hover .poster, .tap:active .poster { transform: none; }
  .tap:active .poster { filter: brightness(.93); }
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<header class="top" id="top">
  <div class="hero">
    <div class="art" aria-hidden="true"></div>
    <div class="seg" id="seg" role="group" aria-label="View">
      <button class="seg-btn" type="button" data-view="grid" aria-pressed="true" aria-label="Grid view"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg></button>
      <button class="seg-btn" type="button" data-view="flow" aria-pressed="false" aria-label="Cover Flow view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 7.5l5-2v13l-5-2z"></path><rect x="8.5" y="3.5" width="7" height="17" rx="1.6"></rect><path d="M22.5 7.5l-5-2v13l5-2z"></path></svg></button>
    </div>
    <h1 class="title">Movie Library</h1>
  </div>
  <div class="wrap test-bar" id="testBar" hidden>
    <p class="test-sum" id="testSum"></p>
    <button class="t-btn" id="testOnly" type="button" aria-pressed="false">Only flagged</button>
    <button class="t-btn" id="testCopy" type="button">Copy results</button>
    <button class="t-btn" id="testExit" type="button">Done checking</button>
  </div>
</header>

<section class="flow" id="flow" aria-label="Cover Flow" hidden>
  <div class="stage" id="stage" role="group" aria-roledescription="Cover Flow" aria-label="Cover Flow"></div>
  <div class="flow-info wrap">
    <h2 class="flow-title" id="flowTitle"><span></span></h2>
    <p class="flow-meta" id="flowMeta"></p>
    <div class="flow-actions">
      <a class="play-btn" id="flowPlay" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>Play in Apple TV</a>
      <span class="marks flow-marks" id="flowMarks"><button class="mark bad" type="button" data-mark="bad" aria-pressed="false">&#x1F517; Mark broken</button></span>
    </div>
    <div class="flow-scrub">
      <input class="scrub" id="flowScrub" type="range" min="0" max="0" step="1" value="0" aria-label="Scrub through titles">
      <span class="flow-count" id="flowCount"></span>
    </div>
  </div>
</section>

<main class="wrap" id="results"><noscript><div class="empty"><img src="icons/icon-192.png" alt="" width="96" height="96"><p>Please turn on JavaScript to see the library.</p></div></noscript></main>
<p class="sr-only" id="status" role="status" aria-live="polite"></p>
<p class="sr-only" id="flowLive" aria-live="polite"></p>

<div class="wrap stripe-wrap"><div class="stripe" aria-hidden="true"></div></div>
<footer class="foot">
  <div class="foot-brand">Movie Library</div>
  <p>Posters and details from TMDB. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  <button class="t-btn foot-btn" id="testToggle" type="button">&#x1F527; Link check</button>
</footer>

<div class="off-wrap" id="offline" role="alert" hidden>
  <div class="offline">
    <p class="off-msg"><svg viewBox="0 0 42 42" aria-hidden="true" focusable="false"><circle cx="21" cy="21" r="20" fill="#FFFFFF"></circle><g fill="none" stroke="#C8102E" stroke-width="3.2" stroke-linecap="round"><path d="M9 17.5a17 17 0 0 1 24 0"></path><path d="M13.5 22a10.5 10.5 0 0 1 15 0"></path><path d="M18 26.5a4 4 0 0 1 6 0"></path><path d="M10 10l22 22"></path></g><circle cx="21" cy="30.5" r="2" fill="#C8102E"></circle></svg>No Wi&#8209;Fi</p>
    <a class="dl-btn" id="dlBtn" href="videos://" draggable="false" aria-label="Open downloads in the Apple TV app"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle cx="16" cy="16" r="15" fill="#FFFFFF"></circle><g fill="none" stroke="#10783A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8v11"></path><path d="M11 14.5l5 5 5-5"></path><path d="M9.5 23.5h13"></path></g></svg>Open Downloads</a>
  </div>
</div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';

  var LIB = Array.isArray(window.LIBRARY) ? window.LIBRARY : [];

  function $(id) { return document.getElementById(id); }
  var resultsEl = $('results'), headerEl = $('top'), statusEl = $('status'), segEl = $('seg');
  var flowEl = $('flow'), stageEl = $('stage'), flowTitleEl = $('flowTitle'), flowMetaEl = $('flowMeta');
  var flowPlayEl = $('flowPlay'), scrubEl = $('flowScrub'), flowCountEl = $('flowCount'), flowLiveEl = $('flowLive');
  var offlineEl = $('offline'), dlBtnEl = $('dlBtn'), flowMarksEl = $('flowMarks');
  var testBarEl = $('testBar'), testSumEl = $('testSum'), testCopyEl = $('testCopy'), testExitEl = $('testExit'), testOnlyEl = $('testOnly');

  /* ---------- storage (always optional) ---------- */
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } }
  // favorites, recently watched and the filter chip are gone: clear what older versions saved on this device
  ['rstd:favs', 'rstd:recent', 'rstd:chip'].forEach(lsDel);

  /* ---------- text helpers ---------- */
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }

  // lower-case, accent-insensitive, curly apostrophes folded to straight (iPad "smart punctuation")
  function norm(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[‘’ʼ]/g, "'")
      .toLowerCase().replace(/\s+/g, ' ').trim();
  }
  function sortKey(title) {
    return norm(title).replace(/^(the|a|an) +/, '').replace(/^[^\p{L}\p{N}]+/u, '');
  }
  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13;
    return h >>> 0;
  }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? String(u) : '#'; }

  /* ---------- library: one A to Z list, movies and shows mixed ---------- */
  // numeric collation keeps "Halloweentown 1, 2, 3, 4" in order and side by side
  var collator = (typeof Intl !== 'undefined' && Intl.Collator) ? new Intl.Collator('en', { numeric: true, sensitivity: 'base' }) : null;
  var items = LIB.map(function (d) {
    var key = d.sort ? norm(d.sort) : sortKey(d.title);
    return { d: d, k: key, dig: /^[0-9]/.test(key) ? 1 : 0, show: d.kind === 'tv' };
  });
  items.sort(function (a, b) {
    if (a.dig !== b.dig) return a.dig - b.dig;
    var c = collator ? collator.compare(a.k, b.k) : (a.k < b.k ? -1 : a.k > b.k ? 1 : 0);
    return c || (a.d.id < b.d.id ? -1 : a.d.id > b.d.id ? 1 : 0);
  });
  var byId = {};
  items.forEach(function (it) { byId[String(it.d.id)] = it; });

  // the Open Downloads button only shows on iPhone / iPad, where videos:// opens the Apple TV app
  // (iPadOS reports itself as a Mac, so a touch screen gives it away)
  var appleTouch = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  dlBtnEl.hidden = !appleTouch;

  // no Wi-Fi: a red alert floats at the bottom with a green button into the Apple TV app, where downloaded titles still play
  function syncOnline() {
    var off = navigator.onLine === false;
    offlineEl.hidden = !off;
    document.body.classList.toggle('is-offline', off);
  }

  /* ---------- state ---------- */
  // link check, for grown-ups testing links: ?test=1 turns it on for this device, ?test=0 turns it off
  var testMode = (function () {
    var m = /[?&]test=([01])\b/.exec(window.location.search);
    if (m) lsSet('rstd:test', m[1]);
    return lsGet('rstd:test') === '1';
  })();
  var checkOnly = false;   // link check mode: show only flagged titles
  var view = lsGet('rstd:view') === 'flow' ? 'flow' : 'grid';

  // link check marks: id -> 'bad' (broken). Older 'ok' marks are ignored
  var marks = {};
  (function () {
    try {
      var o = JSON.parse(lsGet('rstd:marks') || '{}');
      Object.keys(o || {}).forEach(function (id) { if (byId[id] && o[id] === 'bad') marks[id] = 'bad'; });
    } catch (e) { /* ignore bad data */ }
  })();
  function setMark(id, val) {
    if (marks[id] === val) delete marks[id]; else marks[id] = val;
    lsSet('rstd:marks', JSON.stringify(marks));
    syncTestBar();
  }

  // what's on screen: everything, or (link check only) marked-broken titles first, then titles that open a search
  function visible() {
    if (!checkOnly) return items;
    return items
      .filter(function (it) { return marks[String(it.d.id)] === 'bad' || !it.d.direct; })
      .map(function (it, i) { return { it: it, i: i, r: marks[String(it.d.id)] === 'bad' ? 0 : 1 }; })
      .sort(function (a, b) { return a.r - b.r || a.i - b.i; })
      .map(function (x) { return x.it; });
  }

  /* ---------- markup ---------- */
  function tileHTML(d) {
    return '<div class="ph g' + (hash(String(d.id)) % 4 + 1) + '" aria-hidden="true"><span>' + esc(d.title) + '</span></div>';
  }

  var LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M10 14.5l-1.8 1.8a3.2 3.2 0 0 1-4.5-4.5L6 9.5"></path><path d="M14 9.5l1.8-1.8a3.2 3.2 0 0 1 4.5 4.5L18 14.5"></path><path d="M8.5 3v2.5M3 8.5h2.5M15.5 21v-2.5M21 15.5h-2.5"></path></svg>';

  // a broken-link flag on titles marked broken (red) or, in link check mode, that open a search (amber)
  function flagHTML(d) {
    var m = marks[String(d.id)];
    if (m === 'bad') return '<span class="link-flag bad" title="Broken">' + LINK_ICON + '</span>';
    return d.direct || !testMode ? '' : '<span class="link-flag search" title="Opens a search, not the title">' + LINK_ICON + '</span>';
  }
  // the small 🔗 button under each poster: red when marked broken
  function marksHTML(id, t) {
    return '<button class="brk" type="button" data-mark="bad" aria-pressed="' + (marks[id] === 'bad') + '" aria-label="Mark ' + t + ' as a broken link">' + LINK_ICON + '</button>';
  }

  function cardHTML(it) {
    var d = it.d, id = String(d.id), t = esc(d.title);
    var meta = d.year ? String(d.year) : '';
    // the grid uses the small copy (thumbs/); the poster loads when it scrolls near (see watchPosters)
    var src = d.thumb || d.poster;
    var media = src
      ? '<img data-src="' + esc(src) + '" alt="" decoding="async" width="420" height="630" draggable="false">'
      : tileHTML(d);
    return '<div class="card" role="listitem" data-id="' + esc(id) + '">' +
      '<a class="tap" href="' + esc(safeUrl(d.link)) + '" target="_blank" rel="noopener" draggable="false" aria-label="Watch ' + t + ' in Apple TV">' +
        '<div class="poster">' + media + flagHTML(d) + '<span class="play-disc" aria-hidden="true"></span></div>' +
        '<div class="name">' + t + '</div>' +
        (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') +
      '</a>' +
      marksHTML(id, t) +
    '</div>';
  }

  function emptyHTML(inner) {
    return '<div class="empty"><img src="icons/icon-192.png" alt="" width="96" height="96" draggable="false"><p>' + inner + '</p></div>';
  }

  /* ---------- posters load as they scroll near, and are let go when they scroll far ----------
     Hundreds of decoded posters is what crashed iOS Safari ("A problem repeatedly occurred") on a long scroll.
     Now only the screen plus about one screen above and below holds pictures; the rest are empty boxes of the same size. */
  var io = null;
  function loadImg(img) {
    var s = img.getAttribute('data-src');
    if (s && img.getAttribute('src') !== s) img.setAttribute('src', s);
  }
  function dropImg(img) {
    if (img.hasAttribute('src')) img.removeAttribute('src');
  }
  function watchPosters() {
    if (io) { io.disconnect(); io = null; }
    var imgs = resultsEl.querySelectorAll('img[data-src]');
    if (!imgs.length) return;
    if (!('IntersectionObserver' in window)) {
      for (var i = 0; i < imgs.length; i++) loadImg(imgs[i]);
      return;
    }
    io = new IntersectionObserver(function (entries) {
      for (var e = 0; e < entries.length; e++) {
        var img = entries[e].target.querySelector('img[data-src]');
        if (!img) continue;
        if (entries[e].isIntersecting) loadImg(img); else dropImg(img);
      }
    }, { rootMargin: '120% 0px 120% 0px' });
    var boxes = resultsEl.querySelectorAll('.poster');
    for (var b = 0; b < boxes.length; b++) io.observe(boxes[b]);
  }
  function stopWatching() {
    if (io) { io.disconnect(); io = null; }
  }

  function render() {
    var list = visible();

    if (view === 'flow' && list.length) {
      stopWatching();
      resultsEl.innerHTML = '';
      resultsEl.hidden = true;
      var flowWasHidden = flowEl.hidden;
      flowEl.hidden = false;
      flowSetList(list);
      if (flowWasHidden) flowReveal();
      statusEl.textContent = plural(list.length, 'title', 'titles') + ' shown';
      return;
    }

    flowStop();
    flowEl.hidden = true;
    resultsEl.hidden = false;
    var html;
    if (!list.length) {
      html = emptyHTML(checkOnly
        ? '&#x2705; No broken links. Tap the &#x1F517; under any title that doesn&#39;t open right.'
        : 'The library is empty.');
    } else {
      html = '<div class="grid" role="list">' + list.map(cardHTML).join('') + '</div>';
    }
    resultsEl.innerHTML = html;
    watchPosters();
    statusEl.textContent = plural(list.length, 'title', 'titles') + ' shown';
  }

  function syncView() {
    var btns = segEl.querySelectorAll('.seg-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-view') === view ? 'true' : 'false');
    }
  }

  /* ---------- header: tucks away on the way down, comes back on any scroll up ---------- */
  var lastY = 0, away = false, scrollTick = false;
  function setAway(on) {
    if (on === away) return;
    away = on;
    headerEl.classList.toggle('away', on);
  }
  function onScroll() {
    scrollTick = false;
    var y = window.pageYOffset || 0;
    var maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    if (y < 0 || y > maxY) return;   // the rubber-band bounce at either end shouldn't flip it
    var dy = y - lastY, hh = headerEl.offsetHeight;
    if (y <= 4) setAway(false);
    else if (dy > 8 && y > 32) setAway(true);
    else if (dy < -8) setAway(false);
    headerEl.classList.toggle('lift', y > 4);
    if (Math.abs(dy) > 8 || y <= 4) lastY = y;
  }
  window.addEventListener('scroll', function () {
    if (scrollTick) return;
    scrollTick = true;
    window.requestAnimationFrame(onScroll);
  }, { passive: true });

  function toTop() { setAway(false); window.scrollTo(0, 0); lastY = 0; }

  // Cover Flow on a short screen: scroll a little so the Play button and scrubber are visible
  function flowReveal() {
    if (view !== 'flow' || flowEl.hidden) return;
    var over = flowEl.getBoundingClientRect().bottom - window.innerHeight;
    if (over > 0) window.scrollTo(0, Math.round(window.pageYOffset + over + 8));
  }

  /* ---------- Cover Flow ---------- */
  var POOL = 17;        // reusable cover elements (window is +/-8 = 17)
  var WIN = 8;
  var DRAG_PX = 0.35;   // one cover per 0.35 * cover-width of drag
  var fl = {
    list: [], pos: 0, target: 0, W: 200, slots: [], probe: null, raf: 0, anim: null, drag: null,
    dragged: false, center: -1, reduced: false, id: null, keep: null, paintQ: 0, liveT: 0, lastStep: 0
  };

  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  fl.reduced = !!(mq && mq.matches);
  if (mq) {
    var onMotion = function (e) {
      fl.reduced = e.matches;
      cancelAnim();
      fl.pos = fl.target = Math.round(fl.pos);
      flowPaint();
    };
    if (mq.addEventListener) mq.addEventListener('change', onMotion);
    else if (mq.addListener) mq.addListener(onMotion);
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function clampPos(v) { return clamp(v, 0, Math.max(0, fl.list.length - 1)); }

  function makeCover() {
    var a = document.createElement('a');
    a.className = 'cf';
    a.target = '_blank';
    a.rel = 'noopener';
    a.draggable = false;
    a.tabIndex = -1;
    a.innerHTML = '<img alt="" draggable="false" decoding="async" width="600" height="900"><span class="shade"></span><span class="play-disc" aria-hidden="true"></span>';
    a._img = a.firstChild;
    a._shade = a.childNodes[1];
    a._disc = a.childNodes[2];
    a._i = -1;
    a._tab = false;
    return a;
  }

  function ensureSlots() {
    if (fl.slots.length) return;
    var probe = document.createElement('span');
    probe.setAttribute('aria-hidden', 'true');
    probe.style.cssText = 'position:absolute;left:0;top:0;width:var(--cf-w);height:1px;visibility:hidden;pointer-events:none';
    stageEl.appendChild(probe);
    fl.probe = probe;
    for (var s = 0; s < POOL; s++) {
      var a = makeCover();
      a.hidden = true;
      stageEl.appendChild(a);
      fl.slots.push(a);
    }
  }

  function flowMeasure() {
    var w = fl.probe ? fl.probe.offsetWidth : 0;
    if (w > 0) fl.W = w;
  }

  function bindCover(a, i) {
    var d = fl.list[i].d, old = a.querySelector('.ph');
    a._i = i;
    a.href = safeUrl(d.link);
    a.setAttribute('aria-label', 'Watch ' + d.title + ' in Apple TV');
    if (old) old.parentNode.removeChild(old);
    if (d.poster) {
      a._img.hidden = false;
      a._img.alt = d.title + ' poster';
      if (a._img.getAttribute('src') !== d.poster) a._img.src = d.poster;
    } else {
      a._img.hidden = true;
      a._img.removeAttribute('src');
      a.insertAdjacentHTML('afterbegin', tileHTML(d));
    }
    a.hidden = false;
  }

  /* where every cover sits for a given (fractional) position */
  function flowPaint() {
    var n = fl.list.length;
    if (!n || flowEl.hidden || !fl.slots.length) return;
    var W = fl.W, pos = fl.pos, c = Math.round(pos), reduced = fl.reduced;
    var lo = Math.max(0, c - WIN), hi = Math.min(n - 1, c + WIN), s, i, el;

    for (s = 0; s < fl.slots.length; s++) {
      el = fl.slots[s];
      if (el._i >= 0 && (el._i < lo || el._i > hi)) { el._i = -1; el.hidden = true; }
    }
    for (i = lo; i <= hi; i++) {
      el = fl.slots[i % POOL];
      if (el._i !== i) bindCover(el, i);
      var d = i - pos, a = Math.abs(d), t = a < 1 ? a : 1, sg = d < 0 ? -1 : 1, tr, shade;
      if (reduced) {
        tr = 'translate3d(' + (d * (W + 14)).toFixed(1) + 'px,0,0)';
        shade = a < 0.5 ? 0 : 0.3;
      } else {
        var x = a < 1 ? sg * 0.62 * W * a : sg * (0.62 * W + (a - 1) * 0.22 * W);
        tr = 'translate3d(' + x.toFixed(1) + 'px,0,' + (-0.6 * W * t).toFixed(1) + 'px) rotateY(' + (-sg * 70 * t).toFixed(2) + 'deg)';
        shade = 0.28 * t;
      }
      el.style.transform = tr;
      el.style.zIndex = String(1000 - Math.round(a * 20));
      el.style.opacity = a > 5.5 ? String(Math.max(0, 1 - (a - 5.5) / 2.5).toFixed(2)) : '1';
      el._shade.style.opacity = shade.toFixed(2);
      el._disc.style.opacity = a < 0.5 ? (1 - a * 2).toFixed(2) : '0';
      var isC = i === c;
      if (el._tab !== isC) { el._tab = isC; el.tabIndex = isC ? 0 : -1; }
    }
    if (c !== fl.center) { fl.center = c; flowInfo(c); }
  }
  function schedulePaint() {
    if (fl.paintQ) return;
    fl.paintQ = window.requestAnimationFrame(function () { fl.paintQ = 0; flowPaint(); });
  }

  /* title, meta, link and scrubber follow the centered cover */
  function flowInfo(i) {
    var it = fl.list[i];
    if (!it) return;
    var d = it.d, id = String(d.id), n = fl.list.length;
    var bits = d.year ? [d.year] : [];
    if (testMode && !d.direct) bits.push('Search link');
    fl.id = id;
    flowTitleEl.firstChild.textContent = d.title;
    flowMetaEl.textContent = bits.join(' · ');
    flowPlayEl.href = safeUrl(d.link);
    flowPlayEl.setAttribute('aria-label', 'Play ' + d.title + ' in Apple TV');
    syncFlowMarks();
    flowCountEl.textContent = (i + 1) + ' of ' + n;
    if (scrubEl.value !== String(i)) scrubEl.value = String(i);
    window.clearTimeout(fl.liveT);
    fl.liveT = window.setTimeout(function () {
      flowLiveEl.textContent = d.title + ', ' + (i + 1) + ' of ' + n;
    }, 350);
  }

  function flowSetList(list) {
    var prev = fl.id, idx = 0, found = false;
    fl.list = list;
    ensureSlots();
    for (var i = 0; i < list.length; i++) {
      if (prev != null && String(list[i].d.id) === prev) { idx = i; found = true; break; }
    }
    if (!found && fl.keep != null) idx = clamp(fl.keep, 0, list.length - 1);
    fl.keep = null;
    fl.slots.forEach(function (el) { el._i = -1; el.hidden = true; });
    cancelAnim();
    fl.center = -1;
    fl.pos = fl.target = idx;
    scrubEl.min = '0';
    scrubEl.max = String(list.length - 1);
    scrubEl.value = String(idx);
    flowMeasure();
    flowPaint();
  }
  function flowStop() { cancelAnim(); }

  /* ---------- motion ---------- */
  function cancelAnim() {
    fl.anim = null;
    if (fl.raf) { window.cancelAnimationFrame(fl.raf); fl.raf = 0; }
  }
  function flowGoto(target, ms) {
    var n = fl.list.length;
    if (!n) return;
    target = clamp(Math.round(target), 0, n - 1);
    fl.target = target;
    cancelAnim();
    if (fl.reduced || !ms || Math.abs(target - fl.pos) < 0.001) { fl.pos = target; flowPaint(); return; }
    fl.anim = { from: fl.pos, to: target, t0: window.performance.now(), dur: ms };
    fl.raf = window.requestAnimationFrame(tick);
  }
  function tick(now) {
    fl.raf = 0;
    var an = fl.anim;
    if (!an) return;
    var p = clamp((now - an.t0) / an.dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
    fl.pos = an.from + (an.to - an.from) * e;
    flowPaint();
    if (p < 1) { fl.raf = window.requestAnimationFrame(tick); }
    else { fl.anim = null; fl.pos = an.to; flowPaint(); }
  }

  /* ---------- Cover Flow input ---------- */
  stageEl.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    fl.dragged = false;
    cancelAnim();
    fl.drag = { id: e.pointerId, x0: e.clientX, pos0: fl.pos, moved: false, samples: [] };
  });
  stageEl.addEventListener('pointermove', function (e) {
    var dr = fl.drag;
    if (!dr || e.pointerId !== dr.id) return;
    if (!dr.moved) {
      if (Math.abs(e.clientX - dr.x0) < 6) return;
      dr.moved = true;
      dr.x0 = e.clientX;
      dr.pos0 = fl.pos;
      try { stageEl.setPointerCapture(e.pointerId); } catch (_) { /* not capturable */ }
    }
    fl.pos = clampPos(dr.pos0 - (e.clientX - dr.x0) / (DRAG_PX * fl.W));
    dr.samples.push({ t: e.timeStamp, p: fl.pos });
    while (dr.samples.length > 2 && e.timeStamp - dr.samples[0].t > 100) dr.samples.shift();
    schedulePaint();
  });
  function endDrag(e) {
    var dr = fl.drag;
    if (!dr || e.pointerId !== dr.id) return;
    fl.drag = null;
    try { stageEl.releasePointerCapture(e.pointerId); } catch (_) { /* nothing captured */ }
    if (!dr.moved) {
      if (Math.abs(fl.pos - Math.round(fl.pos)) > 0.001) flowGoto(Math.round(fl.pos), 160);
      return;
    }
    fl.dragged = true;
    var carry = 0, s = dr.samples;
    if (s.length > 1) {
      var a = s[0], b = s[s.length - 1], dt = b.t - a.t;
      if (dt > 8 && e.timeStamp - b.t < 80) carry = clamp((b.p - a.p) / dt * 200, -2, 2);
    }
    flowGoto(Math.round(fl.pos + carry), 300);
  }
  stageEl.addEventListener('pointerup', endDrag);
  stageEl.addEventListener('pointercancel', endDrag);

  // a tap on a side cover brings it to the middle; only the middle cover opens Apple TV
  stageEl.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a.cf') : null;
    if (!a) return;
    if (fl.dragged) { e.preventDefault(); return; }
    if (a._i !== fl.center) { e.preventDefault(); flowGoto(a._i, 320); }
  });

  function syncFlowMarks() {
    var btns = flowMarksEl.querySelectorAll('.mark');
    for (var i = 0; i < btns.length; i++) {
      var on = marks[fl.id] === btns[i].getAttribute('data-mark');
      btns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
      btns[i].innerHTML = on ? '&#x274C; Broken' : '&#x1F517; Mark broken';
    }
  }
  flowMarksEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.mark') : null;
    if (!btn || !fl.id) return;
    setMark(fl.id, btn.getAttribute('data-mark'));
    if (checkOnly) { fl.keep = fl.center; render(); return; }
    syncFlowMarks();
  });
  stageEl.addEventListener('dragstart', function (e) { e.preventDefault(); });

  stageEl.addEventListener('wheel', function (e) {
    if (!fl.list.length) return;
    var dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!dx) return;
    e.preventDefault();
    var now = e.timeStamp;
    if (now - fl.lastStep < 70) return;
    if (Math.abs(dx) < 4) return;
    fl.lastStep = now;
    flowGoto(Math.round(fl.target) + (dx > 0 ? 1 : -1), 280);
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (view !== 'flow' || flowEl.hidden || !fl.list.length) return;
    fl.dragged = false;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;   // the scrubber keeps its own keys
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); flowGoto(Math.round(fl.target) + 1, 280); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); flowGoto(Math.round(fl.target) - 1, 280); }
    else if (e.key === 'Enter' && tag !== 'A' && tag !== 'BUTTON') {
      var el = fl.slots[fl.center % POOL];
      if (el && el._i === fl.center) { e.preventDefault(); el.click(); }
    }
  });

  scrubEl.addEventListener('input', function () {
    cancelAnim();
    fl.pos = fl.target = clampPos(Number(scrubEl.value) || 0);
    flowPaint();
  });

  /* ---------- toggle and grid events ---------- */
  segEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.seg-btn') : null;
    if (!btn) return;
    var v = btn.getAttribute('data-view') === 'flow' ? 'flow' : 'grid';
    if (v === view) return;
    view = v;
    lsSet('rstd:view', view);
    syncView();
    render();
    toTop();
    flowReveal();
  });

  // the 🔗 button under a poster marks it broken; the list only changes in link check's "Only flagged" view
  resultsEl.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    var mark = e.target.closest('[data-mark]');
    if (!mark) return;
    var card = mark.closest('.card'), id = card ? card.getAttribute('data-id') : null;
    if (!id || !byId[id]) return;
    setMark(id, mark.getAttribute('data-mark'));
    if (checkOnly) { render(); return; }
    mark.setAttribute('aria-pressed', marks[id] === 'bad' ? 'true' : 'false');
    var poster = card.querySelector('.poster'), old = poster && poster.querySelector('.link-flag');
    if (old) old.parentNode.removeChild(old);
    if (poster) poster.insertAdjacentHTML('beforeend', flagHTML(byId[id].d));
  });

  // a poster that fails to load turns into the colorful title tile
  resultsEl.addEventListener('error', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG' || !img.closest) return;
    var card = img.closest('.card'), it = card ? byId[card.getAttribute('data-id')] : null;
    if (it && img.parentNode && img.closest('.poster')) {
      img.insertAdjacentHTML('beforebegin', tileHTML(it.d));
      img.parentNode.removeChild(img);
    }
  }, true);
  stageEl.addEventListener('error', function (e) {
    var img = e.target, a = img && img.closest ? img.closest('a.cf') : null;
    if (!a || img.tagName !== 'IMG' || a._i < 0 || !fl.list[a._i]) return;
    img.hidden = true;
    if (!a.querySelector('.ph')) a.insertAdjacentHTML('afterbegin', tileHTML(fl.list[a._i].d));
  }, true);

  function onResize() {
    if (!flowEl.hidden) { flowMeasure(); flowPaint(); }
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  // lets :active press feedback fire on older iOS Safari
  document.addEventListener('touchstart', function () {}, { passive: true });

  window.addEventListener('online', syncOnline);
  window.addEventListener('offline', syncOnline);

  /* ---------- link check bar (grown-ups only) ---------- */
  function syncTestBar() {
    testBarEl.hidden = !testMode;
    var bad = 0, search = 0;
    items.forEach(function (it) {
      if (marks[String(it.d.id)] === 'bad') bad++; else if (!it.d.direct) search++;
    });
    testSumEl.textContent = 'Link check: tap the \u{1F517} under any title that opens the wrong page. ' +
      bad + ' marked broken · ' + search + ' more open a search.';
    testOnlyEl.setAttribute('aria-pressed', checkOnly ? 'true' : 'false');
    testOnlyEl.textContent = checkOnly ? 'Show all' : 'Only flagged';
  }
  function testReport() {
    var bad = [], search = [];
    items.forEach(function (it) {
      var line = it.d.title + (it.show ? ' (show)' : '') + ' [' + it.d.id + ']';
      if (marks[String(it.d.id)] === 'bad') bad.push(line); else if (!it.d.direct) search.push(line);
    });
    return 'Movie Library link check\n\n' +
      'Marked broken (' + bad.length + '):\n' + (bad.join('\n') || '-') + '\n\n' +
      'Open a search instead of the title (' + search.length + '):\n' + (search.join('\n') || '-') + '\n';
  }
  testOnlyEl.addEventListener('click', function () {
    checkOnly = !checkOnly;
    syncTestBar();
    render();
    toTop();
  });
  testCopyEl.addEventListener('click', function () {
    var text = testReport();
    var done = function () { testCopyEl.textContent = 'Copied!'; window.setTimeout(function () { testCopyEl.textContent = 'Copy results'; }, 1800); };
    var fallback = function () { window.prompt('Copy the link check results:', text); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  });
  function setTestMode(on) {
    lsSet('rstd:test', on ? '1' : '0');
    window.location.href = window.location.pathname;
  }
  testExitEl.addEventListener('click', function () { setTestMode(false); });
  var testToggleEl = $('testToggle');
  if (testMode) testToggleEl.innerHTML = '&#x1F527; Turn off link check';
  testToggleEl.addEventListener('click', function () {
    setTestMode(!testMode);
  });

  /* ---------- start ---------- */
  syncOnline();
  syncTestBar();
  syncView();
  render();
  flowReveal();

  // offline support: sw.js keeps the app and every poster on the device
  if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
        if (reg.active) reg.active.postMessage('save-posters');
      }).catch(function () { /* offline support is optional */ });
    });
  }
})();
</script>
</body>
</html>

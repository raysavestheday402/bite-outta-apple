<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Movie Library</title>
<!-- raysavestheday icon integration -->
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="icons/manifest.webmanifest">
<meta name="theme-color" content="#04020d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Movies">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: a deep-space night scene with neon glow (matches the hero icon) > one banner header with the Grid / Cover Flow / Surprise buttons that tucks away on scroll down > big neon-rimmed posters in a grid OR a full-width Cover Flow > footer. Offline: a full-screen "No Wi-Fi" cover. */
:root {
  color-scheme: dark;

  /* neon palette, taken from the icon */
  --space: #04020d;          /* banner edge colour, so the header melts into the page */
  --night-1: #0d0830;
  --night-2: #1a0a4a;
  --night-3: #0a1a55;
  --pink: #FF3D9A;
  --blue: #29B6FF;
  --violet: #9A4DFF;
  --orange: #FF9F1C;
  --green: #35F0A0;
  --yellow: #FFE14D;
  --white: #FFFFFF;
  --ink: #0A0626;
  --meta: #C9C2FF;

  --glass: rgba(10, 6, 38, .72);
  --hairline: rgba(255, 255, 255, .22);
  --red: #FF3B5C;

  --grad-hot: linear-gradient(135deg, var(--pink), var(--orange));
  --grad-cool: linear-gradient(135deg, var(--blue), var(--violet));
  --grad-go: linear-gradient(135deg, #46FFB0, #12B87A);
  --scene:
    radial-gradient(ellipse 60% 38% at 12% 8%, rgba(255, 61, 154, .30), transparent 70%),
    radial-gradient(ellipse 60% 38% at 90% 14%, rgba(41, 182, 255, .30), transparent 70%),
    radial-gradient(ellipse 80% 40% at 50% 105%, rgba(154, 77, 255, .35), transparent 70%),
    linear-gradient(180deg, var(--night-2) 0%, var(--night-1) 45%, var(--space) 100%);

  --shadow-poster: 0 8px 18px rgba(0, 0, 0, .6);
  --shadow-text: 0 2px 4px rgba(0, 0, 0, .8);
  --shadow-btn: 0 8px 22px rgba(0, 0, 0, .55);

  --font-display: "Anton", Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif;
  --font-body: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* banner height: scales with the screen in either orientation */
  --hd: calc(env(safe-area-inset-top, 0px) + clamp(64px, 7vw, 84px));
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }

/* kid-proof touch: no long-press preview or selection, no tap flash, no double-tap zoom */
* {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
html, body { touch-action: manipulation; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: var(--space);
  color: var(--white);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.35;
  -webkit-font-smoothing: antialiased;
}
body.is-offline { overflow: hidden; }

#bg { position: fixed; inset: 0; z-index: -1; pointer-events: none; background-color: var(--space); background-image: var(--scene); }
body::before {   /* paints the iPad status-bar area */
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--space);
}

.wrap {
  width: 100%; max-width: 1760px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; border: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }

/* ---------- header: the banner art, with the big buttons on top ---------- */
.top {
  position: sticky; top: 0; z-index: 30;
  background: var(--space);
  transition: transform .3s ease, box-shadow .2s ease;
}
.top.lift { box-shadow: 0 8px 24px rgba(0, 0, 0, .7); }
.top.away { transform: translateY(-110%); visibility: hidden; transition: transform .3s ease, visibility 0s .3s; }
.hero {
  position: relative; height: var(--hd); overflow: hidden;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: env(safe-area-inset-top, 0px) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px));
}
/* the banner art is a soft backdrop across the whole bar; the icon and wordmark sit on top of it */
.art {
  position: absolute; inset: 0; opacity: .6;
  background: url(icons/header-art.jpg) 50% 30% / cover no-repeat;
}
.art::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(4, 2, 13, .92) 0%, rgba(4, 2, 13, .35) 40%, rgba(4, 2, 13, .35) 60%, rgba(4, 2, 13, .92) 100%);
}
.hero::after {   /* thin neon line under the header */
  content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: linear-gradient(90deg, var(--pink), var(--violet), var(--blue));
}
.brand { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand-icon { flex: none; display: block; width: calc(var(--hd) - env(safe-area-inset-top, 0px) - 14px); height: calc(var(--hd) - env(safe-area-inset-top, 0px) - 14px); border-radius: 22%; box-shadow: 0 0 0 2px rgba(255, 255, 255, .35), 0 0 16px rgba(255, 61, 154, .6), 0 0 26px rgba(41, 182, 255, .45); }
.brand-word {
  font-family: var(--font-display); font-size: clamp(30px, 4.4vw, 46px); line-height: 1.1; letter-spacing: .06em; text-transform: uppercase;
  padding-right: .06em; white-space: nowrap;
  background: linear-gradient(180deg, #8fdcff 0%, #c25bff 55%, #ff3d9a 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 8px rgba(255, 61, 154, .55)) drop-shadow(0 2px 2px rgba(0, 0, 0, .8));
}

/* the three big buttons: Surprise, Grid, Cover Flow */
.seg {
  position: relative; z-index: 2; flex: none;
  display: inline-flex; align-items: stretch; gap: 4px; padding: 4px;
  border: 2px solid var(--hairline); border-radius: 999px; background: var(--glass);
}
.seg-btn {
  display: grid; place-items: center; width: 54px; height: 46px; margin: 0; padding: 0; border: 0; border-radius: 999px;
  background: transparent; color: var(--white); font-size: 26px; line-height: 1;
  cursor: pointer; -webkit-appearance: none; appearance: none;
}
.seg-btn svg { width: 28px; height: 28px; fill: currentColor; }
.seg-btn[aria-pressed="true"] { background: var(--grad-hot); color: var(--white); box-shadow: 0 0 14px var(--pink); }
.seg-btn:active { transform: scale(.92); }
.seg-btn.dice { background: var(--grad-cool); box-shadow: 0 0 12px var(--blue); }

/* ---------- content ---------- */
main.wrap { padding-top: 22px; padding-bottom: 20px; min-height: 50vh; }

.grid { --col: clamp(168px, 13vw, 250px); display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--col), 1fr)); gap: clamp(26px, 2.4vw, 44px) clamp(16px, 1.6vw, 30px); }
@media (max-width: 599px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; } }

.card { position: relative; min-width: 0; --rim: var(--pink); }
.card.r2, .cf.r2 { --rim: var(--blue); }
.card.r3, .cf.r3 { --rim: var(--green); }
.card.r4, .cf.r4 { --rim: var(--orange); }
.card.r5, .cf.r5 { --rim: var(--violet); }
.tap { display: block; border-radius: 20px; color: inherit; text-decoration: none; }
.poster {
  position: relative; width: 100%; aspect-ratio: 2 / 3;
  border-radius: 18px; overflow: hidden; background: var(--night-3);
  box-shadow: 0 0 0 4px var(--rim), var(--shadow-poster);   /* a neon rim in a rotating colour */
  transition: transform .15s ease, box-shadow .15s ease;
}
.poster img { display: block; width: 100%; height: 100%; object-fit: cover; }
.tap:active .poster { transform: scale(.94); box-shadow: 0 0 0 4px var(--white), 0 0 22px 6px var(--rim); }
@media (hover: hover) and (pointer: fine) {
  .tap:hover .poster { transform: translateY(-4px); box-shadow: 0 0 0 4px var(--rim), 0 0 26px 6px var(--rim); }
}
.name {
  margin: 12px 4px 0; text-shadow: var(--shadow-text);
  font-weight: 900; font-size: clamp(18px, 1.35vw, 25px); line-height: 1.2;
  display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; overflow-wrap: break-word; hyphens: manual;
}
.meta { margin: 2px 4px 0; color: var(--meta); text-shadow: var(--shadow-text); font-weight: 800; font-size: clamp(15px, 1vw, 19px); }

/* fallback tile when a title has no poster */
.ph {
  position: absolute; inset: 0; display: grid; place-items: center; padding: 36px 12px;
  text-align: center; color: var(--white); text-shadow: var(--shadow-text);
  font-family: var(--font-display); font-size: 24px; line-height: 1.1; letter-spacing: .02em; text-transform: uppercase;
}
.ph span { display: -webkit-box; -webkit-line-clamp: 6; line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ph.g1 { background: linear-gradient(155deg, var(--pink), var(--violet)); }
.ph.g2 { background: linear-gradient(155deg, var(--blue), var(--violet)); }
.ph.g3 { background: linear-gradient(155deg, var(--green), var(--blue)); }
.ph.g4 { background: linear-gradient(155deg, var(--orange), var(--pink)); }

/* big glowing play disc (Cover Flow centre cover) */
.play-disc {
  position: absolute; left: 50%; top: 50%; width: var(--disc, 72px); height: var(--disc, 72px);
  margin: calc(var(--disc, 72px) / -2) 0 0 calc(var(--disc, 72px) / -2);
  border-radius: 50%; border: 3px solid var(--white); pointer-events: none;
  background: var(--grad-hot);
  box-shadow: 0 0 0 5px rgba(255, 255, 255, .25), 0 0 26px 6px var(--pink);
}
.play-disc::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 34%; height: 38%;
  transform: translate(-36%, -50%); background: var(--white); clip-path: polygon(0 0, 100% 50%, 0 100%);
}

/* ---------- broken-link button (grown-ups testing links). Remove it all by setting BROKEN_LINK_BUTTON = false in the script. ---------- */
.brk {
  position: absolute; right: -4px; top: -10px; z-index: 3; width: 48px; height: 48px; padding: 0;
  display: grid; place-items: center; isolation: isolate;
  border: 0; border-radius: 50%; background: none; color: var(--white);
  cursor: pointer; -webkit-appearance: none; appearance: none;
}
.brk::before {
  content: ""; position: absolute; z-index: -1; left: 6px; top: 6px; width: 36px; height: 36px;
  border: 2px solid var(--hairline); border-radius: 50%; background: var(--glass);
}
.brk svg { width: 20px; height: 20px; }
.brk[aria-pressed="true"] { color: var(--white); }
.brk[aria-pressed="true"]::before { background: var(--red); border-color: var(--white); }
.link-flag {
  position: absolute; left: 8px; bottom: 8px; width: 38px; height: 38px;
  display: grid; place-items: center; border-radius: 50%; border: 3px solid var(--white); background: var(--red); color: var(--white);
}
.link-flag svg { width: 20px; height: 20px; }
.mark {
  flex: none; min-height: 56px; margin: 0; padding: 0 22px; border-radius: 999px;
  border: 2px solid var(--hairline); background: var(--glass); color: var(--white);
  font-family: var(--font-body); font-weight: 900; font-size: 16px; white-space: nowrap;
  cursor: pointer; -webkit-appearance: none; appearance: none;
}
.mark[aria-pressed="true"] { background: var(--red); border-color: var(--white); }
.broken-note {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; margin: 18px auto 0;
  color: var(--meta); font-weight: 800; font-size: 15px;
}
.broken-note button {
  min-height: 44px; padding: 0 18px; border-radius: 999px; border: 2px solid var(--hairline); background: var(--glass); color: var(--white);
  font-family: var(--font-body); font-weight: 900; font-size: 15px; cursor: pointer; -webkit-appearance: none; appearance: none;
}

/* ---------- empty state ---------- */
.empty { max-width: 520px; margin: 40px auto; padding: 28px 24px; text-align: center; background: var(--glass); border: 2px solid var(--hairline); border-radius: 24px; font-weight: 900; font-size: 22px; }
.empty img { display: block; width: 96px; height: 96px; margin: 0 auto 16px; border-radius: 22px; }

/* ---------- Cover Flow ---------- */
.flow { --cf-h: min(56vh, 600px); --cf-w: calc(var(--cf-h) * 2 / 3); padding-top: 8px; }
@supports (height: 100dvh) {
  .flow { --cf-h: max(190px, min(64vh, 680px, 92vw, calc((100dvh - var(--hd) - 236px) / 1.14))); }
}
.stage {
  position: relative; height: calc(var(--cf-h) * 1.14 + 22px); overflow: hidden;
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 70px), transparent);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 70px), transparent);
  perspective: 1100px; perspective-origin: 50% 38%;
  touch-action: none; cursor: grab;
}
.stage:active { cursor: grabbing; }
.stage::before {
  content: ""; position: absolute; left: 0; right: 0; top: calc(var(--cf-h) + 15px); bottom: 0; z-index: 0;
  border-top: 2px solid rgba(255, 61, 154, .55);
  background: linear-gradient(180deg, rgba(154, 77, 255, .28), transparent 75%);
}
.cf {
  --rim: var(--pink);
  position: absolute; left: 50%; top: 14px; display: block;
  width: var(--cf-w); height: var(--cf-h); margin-left: calc(var(--cf-w) / -2);
  border-radius: 12px; overflow: hidden; background: var(--night-3);
  box-shadow: 0 0 0 4px var(--rim), var(--shadow-poster);
  -webkit-box-reflect: below 2px linear-gradient(transparent 62%, rgba(255, 255, 255, .28));
  will-change: transform; color: inherit; text-decoration: none; -webkit-user-drag: none;
}
.cf img { display: block; width: 100%; height: 100%; object-fit: cover; -webkit-user-drag: none; }
.cf .shade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
.cf .play-disc { --disc: max(84px, calc(var(--cf-w) * .4)); top: auto; bottom: 7%; margin: 0 0 0 calc(var(--disc) / -2); opacity: 0; }

.flow-info { padding-top: 2px; padding-bottom: 14px; text-align: center; }
.flow-title {
  min-height: 1.15em; margin: 0 auto; max-width: 820px;
  display: flex; align-items: flex-end; justify-content: center;
  font-family: var(--font-display); font-weight: 400; letter-spacing: .03em; text-transform: uppercase;
  font-size: 36px; line-height: 1.12; color: var(--white);
  text-shadow: 0 0 18px var(--pink), 0 3px 4px rgba(0, 0, 0, .8);
}
.flow-title span { display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: break-word; }
.flow-meta { margin: 4px 0 0; min-height: 1.4em; color: var(--meta); font-weight: 800; font-size: 17px; }
.flow-actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; margin-top: 10px; }
.play-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  min-height: 72px; padding: 0 44px; border-radius: 999px; border: 3px solid var(--white);
  background: var(--grad-hot); color: var(--white); text-decoration: none; text-shadow: var(--shadow-text);
  font-family: var(--font-body); font-weight: 900; font-size: 26px; line-height: 1;
  box-shadow: 0 0 22px var(--pink), var(--shadow-btn);
}
.play-btn svg { width: 30px; height: 30px; fill: currentColor; }
.play-btn:active { transform: scale(.95); }
.flow-scrub { display: flex; align-items: center; gap: 14px; max-width: 640px; margin: 16px auto 0; }
.scrub { -webkit-appearance: none; appearance: none; flex: 1 1 auto; min-width: 0; height: 48px; margin: 0; background: transparent; cursor: pointer; }
.scrub::-webkit-slider-runnable-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--pink), var(--violet), var(--blue)); }
.scrub::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 42px; height: 42px; margin-top: -16px; border: 4px solid var(--white); border-radius: 50%; background: var(--yellow); box-shadow: var(--shadow-btn); }
.scrub::-moz-range-track { height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--pink), var(--violet), var(--blue)); }
.scrub::-moz-range-thumb { width: 36px; height: 36px; border: 4px solid var(--white); border-radius: 50%; background: var(--yellow); }
.flow-count { flex: none; min-width: 90px; text-align: right; color: var(--meta); font-weight: 900; font-size: 16px; font-variant-numeric: tabular-nums; }

@media (max-width: 599px) {
  :root { --hd: calc(env(safe-area-inset-top, 0px) + 62px); }
  .brand { gap: 9px; }
  .brand-word { font-size: 28px; }
  .seg { padding: 3px; gap: 2px; }
  .seg-btn { width: 46px; height: 42px; font-size: 22px; }
  .seg-btn svg { width: 24px; height: 24px; }
  .flow-title { font-size: 30px; }
  .play-btn { min-height: 66px; padding: 0 34px; font-size: 24px; }
}

/* ---------- jump-to-top rocket ---------- */
.to-top {
  position: fixed; z-index: 25; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: 68px; height: 68px; padding: 0; display: grid; place-items: center;
  border: 3px solid var(--white); border-radius: 50%; background: var(--grad-cool); color: var(--white); font-size: 34px; line-height: 1;
  box-shadow: 0 0 20px var(--blue), var(--shadow-btn); cursor: pointer; -webkit-appearance: none; appearance: none;
  transition: opacity .2s ease, transform .2s ease;
}
.to-top:active { transform: scale(.9); }
.to-top.hide { opacity: 0; pointer-events: none; transform: translateY(20px); }

/* ---------- OFFLINE: a full-screen cover, so nothing else can be tapped ---------- */
.off {
  position: fixed; inset: 0; z-index: 100; overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; text-align: center;
  padding: calc(24px + env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
  background:
    radial-gradient(ellipse 70% 50% at 50% 30%, rgba(255, 61, 154, .5), transparent 70%),
    radial-gradient(ellipse 80% 50% at 50% 100%, rgba(41, 182, 255, .4), transparent 70%),
    var(--night-1);
}
.off-icon { width: min(46vw, 36vh, 260px); height: auto; filter: drop-shadow(0 0 24px var(--pink)); animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.off-title {
  margin: 0; font-family: var(--font-display); font-weight: 400; letter-spacing: .04em; text-transform: uppercase;
  font-size: clamp(54px, 11vw, 110px); line-height: 1.05; color: var(--white);
  text-shadow: 0 0 26px var(--pink), 0 4px 6px rgba(0, 0, 0, .8);
}
.off-sub { margin: -8px 0 0; color: var(--meta); font-weight: 800; font-size: clamp(18px, 3vw, 26px); }
.off-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; }
.big-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 14px;
  min-height: 84px; padding: 0 38px; border-radius: 999px; border: 4px solid var(--white);
  color: var(--white); text-decoration: none; text-shadow: var(--shadow-text);
  font-family: var(--font-body); font-weight: 900; font-size: 28px; line-height: 1;
  box-shadow: var(--shadow-btn); cursor: pointer; -webkit-appearance: none; appearance: none; -webkit-user-drag: none;
}
.big-btn svg { flex: none; width: 40px; height: 40px; }
.big-btn:active { transform: scale(.95); }
.big-btn.go { background: var(--grad-go); box-shadow: 0 0 24px #1fe69a, var(--shadow-btn); }
.big-btn.again { background: var(--grad-cool); box-shadow: 0 0 24px var(--blue), var(--shadow-btn); }
.big-btn.spin svg { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.off-note { margin: 0; min-height: 1.4em; color: var(--yellow); font-weight: 900; font-size: 20px; }

/* ---------- footer ---------- */
.stripe-wrap { margin-top: 24px; }
.stripe { height: 5px; border-radius: 4px; background: linear-gradient(90deg, var(--pink), var(--orange), var(--green), var(--blue), var(--violet)); }
.foot { padding: 14px 16px calc(22px + env(safe-area-inset-bottom, 0px)); text-align: center; color: rgba(201, 194, 255, .55); font-size: 10.5px; line-height: 1.4; }
.foot p { max-width: 520px; margin: 0 auto; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .tap:hover .poster, .tap:active .poster { transform: none; }
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<header class="top" id="top">
  <div class="hero">
    <div class="art" aria-hidden="true"></div>
    <div class="brand"><img class="brand-icon" src="icons/icon-192.png" alt="" width="192" height="192" draggable="false"><h1 class="brand-word"><span class="sr-only">Movie Library</span><span aria-hidden="true">Movies</span></h1></div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';

  /* Set to false to remove every broken-link button, flag and note (the marks already saved on a device stay unused). */
  var BROKEN_LINK_BUTTON = true;

  var LIB = Array.isArray(window.LIBRARY) ? window.LIBRARY : [];

  function $(id) { return document.getElementById(id); }
  var resultsEl = $('results'), headerEl = $('top'), statusEl = $('status'), segEl = $('seg');
  var flowEl = $('flow'), stageEl = $('stage'), flowTitleEl = $('flowTitle');
  var flowPlayEl = $('flowPlay'), scrubEl = $('flowScrub'), flowCountEl = $('flowCount'), flowLiveEl = $('flowLive');
  var offlineEl = $('offline'), dlBtnEl = $('dlBtn'), retryEl = $('retry'), retryLabelEl = $('retryLabel'), offNoteEl = $('offNote');
  var flowMarkEl = $('flowMark'), toTopEl = $('toTop');
  var noteEl = $('brokenNote'), noteCountEl = $('brokenCount'), noteCopyEl = $('brokenCopy'), noteClearEl = $('brokenClear');

  if (!BROKEN_LINK_BUTTON) {
    Array.prototype.forEach.call(document.querySelectorAll('[data-broken-ui]'), function (el) { el.parentNode.removeChild(el); });
    flowMarkEl = null; noteEl = null;
  }

  /* ---------- storage (always optional) ---------- */
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } }
  ['rstd:favs', 'rstd:recent', 'rstd:chip', 'rstd:test'].forEach(lsDel);   // features that no longer exist

  /* ---------- text helpers ---------- */
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }
  function norm(s) {
    return String(s == null ? '' : s)
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[‘’ʼ]/g, "'")
      .toLowerCase().replace(/\s+/g, ' ').trim();
  }
  function sortKey(title) { return norm(title).replace(/^(the|a|an) +/, '').replace(/^[^\p{L}\p{N}]+/u, ''); }
  function hash(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13;
    return h >>> 0;
  }
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? String(u) : '#'; }
  function rim(id) { return 'r' + (hash('rim' + id) % 5 + 1); }

  /* ---------- library: one A to Z list, movies and shows mixed ---------- */
  // numeric collation keeps "Halloweentown 1, 2, 3, 4" in order; a "sort" field in data.js keeps related titles side by side
  var collator = (typeof Intl !== 'undefined' && Intl.Collator) ? new Intl.Collator('en', { numeric: true, sensitivity: 'base' }) : null;
  var items = LIB.map(function (d) {
    var key = d.sort ? norm(d.sort) : sortKey(d.title);
    return { d: d, k: key, dig: /^[0-9]/.test(key) ? 1 : 0 };
  });
  items.sort(function (a, b) {
    if (a.dig !== b.dig) return a.dig - b.dig;
    var c = collator ? collator.compare(a.k, b.k) : (a.k < b.k ? -1 : a.k > b.k ? 1 : 0);
    return c || (a.d.id < b.d.id ? -1 : a.d.id > b.d.id ? 1 : 0);
  });
  var byId = {};
  items.forEach(function (it) { byId[String(it.d.id)] = it; });

  /* ---------- state ---------- */
  var view = lsGet('rstd:view') === 'flow' ? 'flow' : 'grid';

  // broken-link marks: id -> 'bad'
  var marks = {};
  if (BROKEN_LINK_BUTTON) {
    try {
      var saved = JSON.parse(lsGet('rstd:marks') || '{}');
      Object.keys(saved || {}).forEach(function (id) { if (byId[id] && saved[id] === 'bad') marks[id] = 'bad'; });
    } catch (e) { /* ignore bad data */ }
  }
  function markCount() { return Object.keys(marks).length; }
  function setMark(id) {
    if (marks[id]) delete marks[id]; else marks[id] = 'bad';
    lsSet('rstd:marks', JSON.stringify(marks));
    syncNote();
  }
  function syncNote() {
    if (!noteEl) return;
    var n = markCount();
    noteEl.hidden = n === 0;
    noteCountEl.textContent = n + (n === 1 ? ' link marked broken' : ' links marked broken');
  }
  function brokenReport() {
    var lines = items.filter(function (it) { return marks[String(it.d.id)]; })
      .map(function (it) { return it.d.title + ' [' + it.d.id + ']'; });
    return 'Movie Library: links marked broken (' + lines.length + ')\n\n' + (lines.join('\n') || '-') + '\n';
  }

  /* ---------- markup ---------- */
  function tileHTML(d) {
    return '<div class="ph g' + (hash(String(d.id)) % 4 + 1) + '" aria-hidden="true"><span>' + esc(d.title) + '</span></div>';
  }
  var LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M10 14.5l-1.8 1.8a3.2 3.2 0 0 1-4.5-4.5L6 9.5"></path><path d="M14 9.5l1.8-1.8a3.2 3.2 0 0 1 4.5 4.5L18 14.5"></path><path d="M8.5 3v2.5M3 8.5h2.5M15.5 21v-2.5M21 15.5h-2.5"></path></svg>';

  function flagHTML(id) { return BROKEN_LINK_BUTTON && marks[id] ? '<span class="link-flag" title="Broken">' + LINK_ICON + '</span>' : ''; }
  function brkHTML(id, t) {
    return BROKEN_LINK_BUTTON
      ? '<button class="brk" type="button" aria-pressed="' + (!!marks[id]) + '" aria-label="Mark ' + t + ' as a broken link">' + LINK_ICON + '</button>'
      : '';
  }

  function cardHTML(it) {
    var d = it.d, id = String(d.id), t = esc(d.title);
    var src = d.thumb || d.poster;   // the grid uses the small copy; it loads when it scrolls near (see watchPosters)
    var media = src ? '<img data-src="' + esc(src) + '" alt="" decoding="async" width="420" height="630" draggable="false">' : tileHTML(d);
    return '<div class="card ' + rim(id) + '" role="listitem" data-id="' + esc(id) + '">' +
      '<a class="tap" href="' + esc(safeUrl(d.link)) + '" target="_blank" rel="noopener" draggable="false" aria-label="Watch ' + t + ' in Apple TV">' +
        '<div class="poster">' + media + flagHTML(id) + '</div>' +
        '<div class="name">' + t + '</div>' +
        (d.year ? '<div class="meta">' + esc(d.year) + '</div>' : '') +
      '</a>' +
      brkHTML(id, t) +
    '</div>';
  }

  /* ---------- posters load as they scroll near, and are let go when they scroll far ----------
     Hundreds of decoded posters is what crashed iOS Safari on a long scroll. Only the screen plus about one screen each way holds pictures. */
  var io = null;
  function loadImg(img) { var s = img.getAttribute('data-src'); if (s && img.getAttribute('src') !== s) img.setAttribute('src', s); }
  function dropImg(img) { if (img.hasAttribute('src')) img.removeAttribute('src'); }
  function watchPosters() {
    if (io) { io.disconnect(); io = null; }
    var imgs = resultsEl.querySelectorAll('img[data-src]');
    if (!imgs.length) return;
    if (!('IntersectionObserver' in window)) { for (var i = 0; i < imgs.length; i++) loadImg(imgs[i]); return; }
    io = new IntersectionObserver(function (entries) {
      for (var e = 0; e < entries.length; e++) {
        var img = entries[e].target.querySelector('img[data-src]');
        if (!img) continue;
        if (entries[e].isIntersecting) loadImg(img); else dropImg(img);
      }
    }, { rootMargin: '120% 0px 120% 0px' });
    var boxes = resultsEl.querySelectorAll('.poster');
    for (var b = 0; b < boxes.length; b++) io.observe(boxes[b]);
  }
  function stopWatching() { if (io) { io.disconnect(); io = null; } }

  function render() {
    if (view === 'flow' && items.length) {
      stopWatching();
      resultsEl.innerHTML = '';
      resultsEl.hidden = true;
      var wasHidden = flowEl.hidden;
      flowEl.hidden = false;
      flowSetList(items);
      if (wasHidden) flowReveal();
      return;
    }
    cancelAnim();
    flowEl.hidden = true;
    resultsEl.hidden = false;
    resultsEl.innerHTML = items.length
      ? '<div class="grid" role="list">' + items.map(cardHTML).join('') + '</div>'
      : '<div class="empty"><img src="icons/icon-192.png" alt="" width="96" height="96" draggable="false"><p>The library is empty.</p></div>';
    watchPosters();
    statusEl.textContent = items.length + ' titles';
  }

  function syncView() {
    var btns = segEl.querySelectorAll('[data-view]');
    for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-pressed', btns[i].getAttribute('data-view') === view ? 'true' : 'false');
  }

  /* ---------- header tucks away on the way down, comes back on any scroll up ---------- */
  var lastY = 0, away = false, scrollTick = false;
  function setAway(on) { if (on === away) return; away = on; headerEl.classList.toggle('away', on); }
  function onScroll() {
    scrollTick = false;
    var y = window.pageYOffset || 0;
    var maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    if (y < 0 || y > maxY) return;   // the rubber-band bounce shouldn't flip it
    var dy = y - lastY;
    if (y <= 4) setAway(false);
    else if (dy > 8 && y > 32) setAway(true);
    else if (dy < -8) setAway(false);
    headerEl.classList.toggle('lift', y > 4);
    toTopEl.classList.toggle('hide', y < 700);
    if (Math.abs(dy) > 8 || y <= 4) lastY = y;
  }
  window.addEventListener('scroll', function () {
    if (scrollTick) return;
    scrollTick = true;
    window.requestAnimationFrame(onScroll);
  }, { passive: true });
  function toTop() { setAway(false); window.scrollTo(0, 0); lastY = 0; }
  toTopEl.addEventListener('click', function () { setAway(false); window.scrollTo({ top: 0, behavior: 'smooth' }); });

  // Cover Flow on a short screen: scroll a little so the Play button and scrubber are visible
  function flowReveal() {
    if (view !== 'flow' || flowEl.hidden) return;
    var over = flowEl.getBoundingClientRect().bottom - window.innerHeight;
    if (over > 0) window.scrollTo(0, Math.round(window.pageYOffset + over + 8));
  }

  /* ---------- Cover Flow ---------- */
  var POOL = 17, WIN = 8, DRAG_PX = 0.35;
  var fl = { list: [], pos: 0, target: 0, W: 200, slots: [], probe: null, raf: 0, anim: null, drag: null,
    dragged: false, center: -1, reduced: false, id: null, paintQ: 0, liveT: 0, lastStep: 0 };

  var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  fl.reduced = !!(mq && mq.matches);
  if (mq) {
    var onMotion = function (e) { fl.reduced = e.matches; cancelAnim(); fl.pos = fl.target = Math.round(fl.pos); flowPaint(); };
    if (mq.addEventListener) mq.addEventListener('change', onMotion); else if (mq.addListener) mq.addListener(onMotion);
  }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function clampPos(v) { return clamp(v, 0, Math.max(0, fl.list.length - 1)); }

  function makeCover() {
    var a = document.createElement('a');
    a.className = 'cf';
    a.target = '_blank'; a.rel = 'noopener'; a.draggable = false; a.tabIndex = -1;
    a.innerHTML = '<img alt="" draggable="false" decoding="async" width="600" height="900"><span class="shade"></span><span class="play-disc" aria-hidden="true"></span>';
    a._img = a.firstChild; a._shade = a.childNodes[1]; a._disc = a.childNodes[2];
    a._i = -1; a._tab = false; a._rim = '';
    return a;
  }
  function ensureSlots() {
    if (fl.slots.length) return;
    var probe = document.createElement('span');
    probe.setAttribute('aria-hidden', 'true');
    probe.style.cssText = 'position:absolute;left:0;top:0;width:var(--cf-w);height:1px;visibility:hidden;pointer-events:none';
    stageEl.appendChild(probe);
    fl.probe = probe;
    for (var s = 0; s < POOL; s++) { var a = makeCover(); a.hidden = true; stageEl.appendChild(a); fl.slots.push(a); }
  }
  function flowMeasure() { var w = fl.probe ? fl.probe.offsetWidth : 0; if (w > 0) fl.W = w; }

  function bindCover(a, i) {
    var d = fl.list[i].d, old = a.querySelector('.ph');
    a._i = i;
    a.href = safeUrl(d.link);
    a.setAttribute('aria-label', 'Watch ' + d.title + ' in Apple TV');
    var r = rim(String(d.id));
    if (a._rim !== r) { if (a._rim) a.classList.remove(a._rim); a.classList.add(r); a._rim = r; }
    if (old) old.parentNode.removeChild(old);
    if (d.poster) {
      a._img.hidden = false;
      a._img.alt = d.title + ' poster';
      if (a._img.getAttribute('src') !== d.poster) a._img.src = d.poster;
    } else {
      a._img.hidden = true; a._img.removeAttribute('src');
      a.insertAdjacentHTML('afterbegin', tileHTML(d));
    }
    a.hidden = false;
  }

  function flowPaint() {
    var n = fl.list.length;
    if (!n || flowEl.hidden || !fl.slots.length) return;
    var W = fl.W, pos = fl.pos, c = Math.round(pos), reduced = fl.reduced;
    var lo = Math.max(0, c - WIN), hi = Math.min(n - 1, c + WIN), s, i, el;
    for (s = 0; s < fl.slots.length; s++) {
      el = fl.slots[s];
      if (el._i >= 0 && (el._i < lo || el._i > hi)) { el._i = -1; el.hidden = true; }
    }
    for (i = lo; i <= hi; i++) {
      el = fl.slots[i % POOL];
      if (el._i !== i) bindCover(el, i);
      var d = i - pos, a = Math.abs(d), t = a < 1 ? a : 1, sg = d < 0 ? -1 : 1, tr, shade;
      if (reduced) {
        tr = 'translate3d(' + (d * (W + 14)).toFixed(1) + 'px,0,0)';
        shade = a < 0.5 ? 0 : 0.3;
      } else {
        var x = a < 1 ? sg * 0.62 * W * a : sg * (0.62 * W + (a - 1) * 0.22 * W);
        tr = 'translate3d(' + x.toFixed(1) + 'px,0,' + (-0.6 * W * t).toFixed(1) + 'px) rotateY(' + (-sg * 70 * t).toFixed(2) + 'deg)';
        shade = 0.28 * t;
      }
      el.style.transform = tr;
      el.style.zIndex = String(1000 - Math.round(a * 20));
      el.style.opacity = a > 5.5 ? String(Math.max(0, 1 - (a - 5.5) / 2.5).toFixed(2)) : '1';
      el._shade.style.opacity = shade.toFixed(2);
      el._disc.style.opacity = a < 0.5 ? (1 - a * 2).toFixed(2) : '0';
      var isC = i === c;
      if (el._tab !== isC) { el._tab = isC; el.tabIndex = isC ? 0 : -1; }
    }
    if (c !== fl.center) { fl.center = c; flowInfo(c); }
  }
  function schedulePaint() {
    if (fl.paintQ) return;
    fl.paintQ = window.requestAnimationFrame(function () { fl.paintQ = 0; flowPaint(); });
  }

  function flowInfo(i) {
    var it = fl.list[i];
    if (!it) return;
    var d = it.d, id = String(d.id), n = fl.list.length;
    fl.id = id;
    flowTitleEl.firstChild.textContent = d.title;
    flowPlayEl.href = safeUrl(d.link);
    flowPlayEl.setAttribute('aria-label', 'Play ' + d.title + ' in Apple TV');
    syncFlowMark();
    flowCountEl.textContent = (i + 1) + ' of ' + n;
    if (scrubEl.value !== String(i)) scrubEl.value = String(i);
    window.clearTimeout(fl.liveT);
    fl.liveT = window.setTimeout(function () { flowLiveEl.textContent = d.title + ', ' + (i + 1) + ' of ' + n; }, 350);
  }

  function flowSetList(list) {
    var prev = fl.id, idx = 0;
    fl.list = list;
    ensureSlots();
    for (var i = 0; i < list.length; i++) { if (prev != null && String(list[i].d.id) === prev) { idx = i; break; } }
    fl.slots.forEach(function (el) { el._i = -1; el.hidden = true; });
    cancelAnim();
    fl.center = -1;
    fl.pos = fl.target = idx;
    scrubEl.min = '0'; scrubEl.max = String(list.length - 1); scrubEl.value = String(idx);
    flowMeasure();
    flowPaint();
  }

  function cancelAnim() { fl.anim = null; if (fl.raf) { window.cancelAnimationFrame(fl.raf); fl.raf = 0; } }
  function flowGoto(target, ms) {
    var n = fl.list.length;
    if (!n) return;
    target = clamp(Math.round(target), 0, n - 1);
    fl.target = target;
    cancelAnim();
    if (fl.reduced || !ms || Math.abs(target - fl.pos) < 0.001) { fl.pos = target; flowPaint(); return; }
    fl.anim = { from: fl.pos, to: target, t0: window.performance.now(), dur: ms };
    fl.raf = window.requestAnimationFrame(tick);
  }
  function tick(now) {
    fl.raf = 0;
    var an = fl.anim;
    if (!an) return;
    var p = clamp((now - an.t0) / an.dur, 0, 1), e = 1 - Math.pow(1 - p, 3);
    fl.pos = an.from + (an.to - an.from) * e;
    flowPaint();
    if (p < 1) fl.raf = window.requestAnimationFrame(tick); else { fl.anim = null; fl.pos = an.to; flowPaint(); }
  }

  /* ---------- Cover Flow input ---------- */
  stageEl.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    fl.dragged = false;
    cancelAnim();
    fl.drag = { id: e.pointerId, x0: e.clientX, pos0: fl.pos, moved: false, samples: [] };
  });
  stageEl.addEventListener('pointermove', function (e) {
    var dr = fl.drag;
    if (!dr || e.pointerId !== dr.id) return;
    if (!dr.moved) {
      if (Math.abs(e.clientX - dr.x0) < 6) return;
      dr.moved = true; dr.x0 = e.clientX; dr.pos0 = fl.pos;
      try { stageEl.setPointerCapture(e.pointerId); } catch (_) { /* not capturable */ }
    }
    fl.pos = clampPos(dr.pos0 - (e.clientX - dr.x0) / (DRAG_PX * fl.W));
    dr.samples.push({ t: e.timeStamp, p: fl.pos });

    schedulePaint();
  });
  function endDrag(e) {
    var dr = fl.drag;
    if (!dr || e.pointerId !== dr.id) return;
    fl.drag = null;
    try { stageEl.releasePointerCapture(e.pointerId); } catch (_) { /* nothing captured */ }
    if (!dr.moved) { if (Math.abs(fl.pos - Math.round(fl.pos)) > 0.001) flowGoto(Math.round(fl.pos), 160); return; }
    fl.dragged = true;
    var carry = 0, s = dr.samples;
    if (s.length > 1) {
      var a = s[0], b = s[s.length - 1], dt = b.t - a.t;
      if (dt > 8 && e.timeStamp - b.t < 80) carry = clamp((b.p - a.p) / dt * 200, -2, 2);
    }
    flowGoto(Math.round(fl.pos + carry), 300);
  }
  stageEl.addEventListener('pointerup', endDrag);
  stageEl.addEventListener('pointercancel', endDrag);

  // a tap on a side cover brings it to the middle; only the middle cover opens Apple TV
  stageEl.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a.cf') : null;
    if (!a) return;
    if (fl.dragged) { e.preventDefault(); return; }
    if (a._i !== fl.center) { e.preventDefault(); flowGoto(a._i, 320); }
  });
  stageEl.addEventListener('dragstart', function (e) { e.preventDefault(); });

  stageEl.addEventListener('wheel', function (e) {
    if (!fl.list.length) return;
    var dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!dx) return;
    e.preventDefault();
    var now = e.timeStamp;
    if (now - fl.lastStep < 70 || Math.abs(dx) < 4) return;
    fl.lastStep = now;
    flowGoto(Math.round(fl.target) + (dx > 0 ? 1 : -1), 280);
  }, { passive: false });

  document.addEventListener('keydown', function (e) {
    if (view !== 'flow' || flowEl.hidden || !fl.list.length) return;
    fl.dragged = false;
    var t = e.target, tag = t && t.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); flowGoto(Math.round(fl.target) + 1, 280); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); flowGoto(Math.round(fl.target) - 1, 280); }
    else if (e.key === 'Enter' && tag !== 'A' && tag !== 'BUTTON') {
      var el = fl.slots[fl.center % POOL];
      if (el && el._i === fl.center) { e.preventDefault(); el.click(); }
    }
  });
  scrubEl.addEventListener('input', function () { cancelAnim(); fl.pos = fl.target = clampPos(Number(scrubEl.value) || 0); flowPaint(); });

  function syncFlowMark() {
    if (!flowMarkEl) return;
    var on = !!marks[fl.id];
    flowMarkEl.setAttribute('aria-pressed', on ? 'true' : 'false');
    flowMarkEl.innerHTML = on ? '&#x274C; Broken' : '&#x1F517; Mark broken';
  }
  if (flowMarkEl) flowMarkEl.addEventListener('click', function () { if (fl.id) { setMark(fl.id); syncFlowMark(); } });

  /* ---------- the three big buttons ---------- */
  segEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button') : null;
    if (!btn) return;
    if (btn.getAttribute('data-act') === 'surprise') {   // jump to Cover Flow on a random title
      view = 'flow'; lsSet('rstd:view', view); syncView(); render(); toTop();
      flowGoto(Math.floor(Math.random() * fl.list.length), 700);
      flowReveal();
      return;
    }
    var v = btn.getAttribute('data-view') === 'flow' ? 'flow' : 'grid';
    if (v === view) return;
    view = v; lsSet('rstd:view', view); syncView(); render(); toTop(); flowReveal();
  });

  // the 🔗 under a poster marks it broken
  resultsEl.addEventListener('click', function (e) {
    if (!BROKEN_LINK_BUTTON || !e.target.closest) return;
    var btn = e.target.closest('.brk');
    if (!btn) return;
    var card = btn.closest('.card'), id = card ? card.getAttribute('data-id') : null;
    if (!id || !byId[id]) return;
    setMark(id);
    btn.setAttribute('aria-pressed', marks[id] ? 'true' : 'false');
    var poster = card.querySelector('.poster'), old = poster && poster.querySelector('.link-flag');
    if (old) old.parentNode.removeChild(old);
    if (poster) poster.insertAdjacentHTML('beforeend', flagHTML(id));
  });
  if (noteEl) {
    noteCopyEl.addEventListener('click', function () {
      var text = brokenReport();
      var done = function () { noteCopyEl.textContent = 'Copied!'; window.setTimeout(function () { noteCopyEl.textContent = 'Copy list'; }, 1800); };
      var fallback = function () { window.prompt('Copy the list of broken links:', text); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
    });
    noteClearEl.addEventListener('click', function () {
      marks = {}; lsSet('rstd:marks', '{}'); syncNote(); render();
    });
  }

  // a poster that fails to load turns into the colorful title tile
  resultsEl.addEventListener('error', function (e) {
    var img = e.target;
    if (!img || img.tagName !== 'IMG' || !img.closest) return;
    var card = img.closest('.card'), it = card ? byId[card.getAttribute('data-id')] : null;
    if (it && img.parentNode && img.closest('.poster')) {
      img.insertAdjacentHTML('beforebegin', tileHTML(it.d));
      img.parentNode.removeChild(img);
    }
  }, true);
  stageEl.addEventListener('error', function (e) {
    var img = e.target, a = img && img.closest ? img.closest('a.cf') : null;
    if (!a || img.tagName !== 'IMG' || a._i < 0 || !fl.list[a._i]) return;
    img.hidden = true;
    if (!a.querySelector('.ph')) a.insertAdjacentHTML('afterbegin', tileHTML(fl.list[a._i].d));
  }, true);

  function onResize() { if (!flowEl.hidden) { flowMeasure(); flowPaint(); } }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  document.addEventListener('touchstart', function () {}, { passive: true });   // lets :active press feedback fire on older iOS Safari

  /* ---------- OFFLINE: a full-screen cover ----------
     navigator.onLine only knows about the Wi-Fi link, not the internet, so when it says "online" we also ask ping.txt (a tiny file the
     service worker never saves). If that request can't get any answer, we're offline. */
  // the Open Downloads button only shows on iPhone / iPad, where videos:// opens the Apple TV app (iPadOS reports itself as a Mac)
  var appleTouch = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  dlBtnEl.hidden = !appleTouch;

  var offline = false, checking = null;
  var coverEls = [headerEl, flowEl, resultsEl, toTopEl, document.querySelector('.stripe-wrap'), document.querySelector('.foot')];
  function setOffline(on) {
    if (on === offline) return;
    offline = on;
    offlineEl.hidden = !on;
    document.body.classList.toggle('is-offline', on);
    coverEls.forEach(function (el) { if (!el) return; if (on) el.setAttribute('inert', ''); else el.removeAttribute('inert'); });
    if (on) { offNoteEl.textContent = ''; window.scrollTo(0, 0); } else { window.requestAnimationFrame(onScroll); }
  }
  function ping() {
    return new Promise(function (resolve) {
      var done = false;
      var timer = window.setTimeout(function () { if (!done) { done = true; resolve(false); } }, 5000);
      var finish = function (ok) { if (!done) { done = true; window.clearTimeout(timer); resolve(ok); } };
      try { window.fetch('ping.txt?t=' + Date.now(), { cache: 'no-store' }).then(function () { finish(true); }, function () { finish(false); }); }
      catch (e) { finish(true); }   // no fetch at all: trust the browser
    });
  }
  function check() {
    if (checking) return checking;
    if (navigator.onLine === false) { setOffline(true); return Promise.resolve(false); }
    checking = ping().then(function (ok) { setOffline(!ok); checking = null; return ok; });
    return checking;
  }
  retryEl.addEventListener('click', function () {
    retryEl.classList.add('spin'); retryLabelEl.textContent = 'Checking…'; offNoteEl.textContent = '';
    var started = Date.now();
    check().then(function (ok) {
      window.setTimeout(function () {   // keep the spinner visible long enough to be seen
        retryEl.classList.remove('spin'); retryLabelEl.textContent = 'Try again';
        if (!ok) offNoteEl.textContent = 'Still no Wi‑Fi. Check the Wi‑Fi and try again.';
      }, Math.max(0, 700 - (Date.now() - started)));
    });
  });
  window.addEventListener('online', check);
  window.addEventListener('offline', function () { setOffline(true); });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
  window.setInterval(function () { if (document.visibilityState === 'visible') check(); }, offline ? 5000 : 30000);
  window.setInterval(function () { if (offline && document.visibilityState === 'visible') check(); }, 5000);

  /* ---------- start ---------- */
  syncNote();
  syncView();
  render();
  flowReveal();
  check();

  // offline support: sw.js keeps the app and every poster on the device
  if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }).then(function (reg) {
        if (reg.active) reg.active.postMessage('save-posters');
      }).catch(function () { /* offline support is optional */ });
    });
  }
})();
</script>
</body>
</html>
